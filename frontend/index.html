<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZSport - Sign Up</title>
    <style>
        /* Reset basic styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Using your local file "wallpaper.jpg" with a slight dark overlay for text readability */
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), 
                        url('wallpaper.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Glassmorphic card container */
        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 25px;
            width: 450px;
            text-align: center;
            color: white;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .logo-icon {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .brand-name {
            font-size: 2.3rem;
            font-weight: bold;
            margin-bottom: 25px;
            color: white;
            letter-spacing: 0.5px;
        }

        /* Admin/User Toggle Switch */
        .role-toggle {
            display: flex;
            background: rgba(80, 100, 180, 0.4);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 35px;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        /* Active state style */
        .role-btn.active {
            background: #5d5bfa;
            color: white;
        }

        /* Input Fields styling */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 16px;
            border-radius: 10px;
            border: none;
            outline: none;
            font-size: 1rem;
            color: #333;
            background-color: white;
        }

        /* Custom placeholder color */
        .input-group input::placeholder {
            color: #999;
        }

        /* Sign Up Button styling */
        .login-btn {
            width: 100%;
            padding: 16px;
            background: #5d5bfa;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
            margin-bottom: 25px;
        }

        .login-btn:hover {
            background: #4543d1;
        }

        .signup-text {
            font-size: 0.9rem;
            color: #e0e0e0;
        }

        .signup-text a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Football Emoji and Brand Name -->
        <div class="logo-icon">⚽</div>
        <div class="brand-name">EZSport</div>

        <!-- Role Toggle Section (Clickable) -->
        <div class="role-toggle">
            <button type="button" class="role-btn" onclick="setRole('admin', this)">Admin</button>
            <button type="button" class="role-btn active" onclick="setRole('user', this)">User</button>
        </div>

        <!-- Form Fields -->
        <form action="home.html">
            <div class="input-group">
                <input type="text" placeholder="Student Id / Email" required>
            </div>

            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" class="login-btn">Sign Up</button>
        </form>

        <p class="signup-text">Don't have an account? <a href="#">Register Now</a></p>
    </div>

    <!-- JavaScript to make the toggle buttons work -->
    <script>
        function setRole(role, element) {
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            element.classList.add('active');
            console.log("Selected role:", role);
        }
    </script>

</body>
</html>
